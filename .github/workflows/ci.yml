name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  DATABASE_URL: mysql://root:root@127.0.0.1:3306/auction
  JWT_SECRET: ci-only-jwt-secret-0123456789
  PEPPER: ci-only-pepper

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: auction
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval 5s --health-timeout 3s --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The workspaces load the repo-root .env; CI provides the same values.
      - name: Write .env
        run: |
          {
            echo "DATABASE_URL=$DATABASE_URL"
            echo "JWT_SECRET=$JWT_SECRET"
            echo "PEPPER=$PEPPER"
          } > .env

      - name: Generate Prisma client
        run: npm run prisma:generate -w server --if-present

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Migrations apply to a fresh database
        run: npm run prisma:deploy -w server

      - name: Integration tests (real MySQL)
        run: npm run test:integration

      - name: Production build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: auction
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval 5s --health-timeout 3s --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write .env
        run: |
          {
            echo "DATABASE_URL=$DATABASE_URL"
            echo "JWT_SECRET=$JWT_SECRET"
            echo "PEPPER=$PEPPER"
          } > .env

      - name: Generate Prisma client
        run: npm run prisma:generate -w server --if-present

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E happy paths (production single-server)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
